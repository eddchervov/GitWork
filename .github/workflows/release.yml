name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (X.Y.Z)
        required: true
        default: "0.3.5"
      create_draft:
        description: Create a draft GitHub release after a successful build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build installer and update packages
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: GitWork-windows-release
          path: artifacts/releases/**/*
          if-no-files-found: error

  draft:
    if: ${{ inputs.create_draft }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GitWork-windows-release
          path: artifacts/releases
      - name: Create a draft for review
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          $releaseFiles = (Get-ChildItem artifacts/releases -File -Recurse).FullName
          gh release create "v$env:RELEASE_VERSION" @releaseFiles --draft --target $env:GITHUB_SHA --title "Git Work $env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
